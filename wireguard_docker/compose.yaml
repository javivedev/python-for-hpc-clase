name: wireguard-auditado
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wg_auditado_vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      SERVERURL: ${SERVERURL}
      SERVERPORT: ${SERVERPORT}
      PEERS: ${PEERS}
      PEERDNS: ${PEERDNS}
      INTERNAL_SUBNET: ${INTERNAL_SUBNET}
      ALLOWEDIPS: ${ALLOWEDIPS}
      LOG_CONFS: "false"
      UMASK: "077"
    volumes:
      - ./env/config:/config
    ports:
      - "${SERVERPORT}:51820/udp"
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
