name: kubernetes-local

services:
  server:
    image: rancher/k3s:v1.37.2-k3s1
    hostname: kubernetes-local
    command: ["server", "--tls-san", "127.0.0.1"]
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${K3S_API_PORT:-6443}:6443"
    volumes:
      - data:/var/lib/rancher/k3s
      - config:/etc/rancher/k3s
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw=/readyz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  data:
  config:
